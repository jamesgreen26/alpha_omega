plugins {
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.137'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_name
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            // -PquickPlay=<world> opens that singleplayer world on launch.
            programArguments.addAll(providers.gradleProperty('quickPlay').map { ['--quickPlaySingleplayer', it] }.orElse([]))
            if (project.hasProperty('auditMixins')) systemProperty 'alpha_omega.auditMixins', 'true'
            if (project.hasProperty('quitAfterAudit')) systemProperty 'alpha_omega.quitAfterAudit', 'true'
            // -PdevScript='40:/tp @s 0 100 0;200:shot test;210:quit' scripts a dev client (see client.DevScript).
            if (project.hasProperty('onlyFace')) systemProperty 'alpha_omega.dev.onlyFace', project.property('onlyFace')
            if (project.hasProperty('devScript')) systemProperty 'alpha_omega.dev.script', project.property('devScript')
            // -PtransferStats logs what each crossing of an edge costs the client (see client.TransferStats).
            if (project.hasProperty('transferStats')) systemProperty 'alpha_omega.dev.transferStats', 'true'
        }
        server {
            server()
        }
        data {
            data()
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', 'alpha_omega'
            // -Pgametests=NeighbourGameTests,TransferGameTests.mobsWaitForRoom runs part of the suite (gametest.GameTestFilter).
            if (project.hasProperty('gametests')) systemProperty 'alpha_omega.gametests', project.property('gametests')
        }
    }

    mods {
        alpha_omega {
            sourceSet sourceSets.main
        }
    }
}

jar {
    manifest.attributes([
        "MixinConfigs": "alpha_omega.mixins.json"
    ])
}

repositories {
    mavenLocal()
    mavenCentral()
    // Mixin Squared and the Sable companion API are vendored in libs/.
    flatDir {
        dirs 'libs'
    }
    // Optional compat targets (Sable, C2ME), compiled against but never bundled.
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

configurations {
    sableMod
    c2meMod
    sodiumMod
}

// C2ME ships its modules as nested jars; compile against the ones compat code uses.
def c2meModules = ['base', 'opts-dfc', 'rewrites-chunk-system']
def extractC2meModules = tasks.register('extractC2meModules', Sync) {
    inputs.property('modules', c2meModules)
    from({ configurations.c2meMod.collect { zipTree(it) } }) {
        c2meModules.each { include "META-INF/jars/c2me-neoforge-${it}-mc*.jar" }
        eachFile { path = name }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('c2me')
}

// Sodium's jar is a service library holding the mod as a nested jar; compile against that.
def extractSodiumMod = tasks.register('extractSodiumMod', Sync) {
    from({ configurations.sodiumMod.collect { zipTree(it) } }) {
        include 'META-INF/jarjar/net.caffeinemc.sodium-neoforge-*-mod.jar'
        eachFile { path = name }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('sodium')
}

dependencies {
    compileOnly("io.github.llamalad7:mixinextras-common:0.5.0")
    jarJar(implementation("io.github.llamalad7:mixinextras-neoforge:0.5.0")) {
        version {
            strictly "[0.5.0,)"
            prefer "0.5.0"
        }
    }

    compileOnly("com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.7-beta.1")
    jarJar(implementation("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:0.3.7-beta.1")) {
        version {
            strictly "[0.3.7-beta.1,)"
            prefer "0.3.7-beta.1"
        }
    }

    // Sable 2.0.6; its companion API ships only inside the Sable jar, so it is vendored in libs/.
    compileOnly("maven.modrinth:sable:fg9dTRz9")
    compileOnly(name: "sable-companion-common-1.21.1-1.6.0")
    sableMod("maven.modrinth:sable:fg9dTRz9") {
        transitive = false
    }
    // C2ME 0.4.0-alpha.0.122; compat code compiles against the modules nested in it.
    c2meMod("maven.modrinth:c2me-neoforge:yxOYFgnK") {
        transitive = false
    }
    compileOnly(fileTree(layout.buildDirectory.dir('c2me')) {
        include '*.jar'
        builtBy extractC2meModules
    })
    // Sodium 0.8.13; neighbour faces draw through its renderer when it is installed.
    sodiumMod("maven.modrinth:sodium:uMOpc5uV") {
        transitive = false
    }
    compileOnly(fileTree(layout.buildDirectory.dir('sodium')) {
        include '*.jar'
        builtBy extractSodiumMod
    })

    testImplementation("org.junit.jupiter:junit-jupiter-api:5.10.0")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.10.0")
}

test {
    useJUnitPlatform()
}

// Dev runs load Sable, C2ME and Sodium from run/mods only with -PwithSable / -PwithC2me / -PwithSodium (they are full
// mods with jar-in-jar libraries).
def syncSableMod = tasks.register('syncSableMod') {
    def withSable = project.hasProperty('withSable')
    def mods = file('run/mods')
    def sable = configurations.sableMod
    doLast {
        project.delete(project.fileTree(mods) { include 'sable-*.jar' })
        if (withSable) project.copy { from sable; into mods }
    }
}
def syncC2meMod = tasks.register('syncC2meMod') {
    def withC2me = project.hasProperty('withC2me')
    def mods = file('run/mods')
    def c2me = configurations.c2meMod
    doLast {
        project.delete(project.fileTree(mods) { include 'c2me-*.jar' })
        if (withC2me) project.copy { from c2me; into mods }
    }
}
def syncSodiumMod = tasks.register('syncSodiumMod') {
    def withSodium = project.hasProperty('withSodium')
    def mods = file('run/mods')
    def sodium = configurations.sodiumMod
    doLast {
        project.delete(project.fileTree(mods) { include 'sodium-*.jar' })
        if (withSodium) project.copy { from sodium; into mods }
    }
}
tasks.matching { it.name ==~ /run[A-Z].*/ }.configureEach {
    dependsOn syncSableMod, syncC2meMod, syncSodiumMod
}
// Gametests start from a fresh world: chunks saved by an earlier run would hide generation changes.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    def world = file('run/world')
    doFirst { project.delete(world) }
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(21)

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}
