plugins {
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.137'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_name
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', 'alpha_omega'
        }
    }

    mods {
        alpha_omega {
            sourceSet sourceSets.main
        }
    }
}

jar {
    manifest.attributes([
        "MixinConfigs": "alpha_omega.mixins.json"
    ])
}

repositories {
    mavenLocal()
    mavenCentral()
    // Mixin Squared is vendored in libs/ because its maven is unreliable.
    flatDir {
        dirs 'libs'
    }
    // Optional compat targets (Xaero's maps), compiled against but never bundled.
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    compileOnly("io.github.llamalad7:mixinextras-common:0.5.0")
    jarJar(implementation("io.github.llamalad7:mixinextras-neoforge:0.5.0")) {
        version {
            strictly "[0.5.0,)"
            prefer "0.5.0"
        }
    }

    compileOnly("com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.7-beta.1")
    jarJar(implementation("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:0.3.7-beta.1")) {
        version {
            strictly "[0.3.7-beta.1,)"
            prefer "0.3.7-beta.1"
        }
    }

    compileOnly("maven.modrinth:xaeros-minimap:Q1tuMQBB")
    compileOnly("maven.modrinth:xaeros-world-map:9Ckiihkz")

    testImplementation("org.junit.jupiter:junit-jupiter-api:5.10.0")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.10.0")
}

test {
    useJUnitPlatform()
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(21)

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}
